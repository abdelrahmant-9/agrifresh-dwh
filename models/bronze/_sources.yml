version: 2

sources:
  - name: raw
    database: AGRIFRESH
    schema: RAW
    description: Landing tables loaded by snowflake/02_load_raw.sql. All columns VARCHAR.
    tables:
      - name: regions
        description: "Sales/operating regions across Egypt, KSA and UAE."
      - name: product_categories
        description: "Product category hierarchy (parent_category_id self-reference)."
      - name: warehouses
        description: "Distribution centres."
      - name: farms
        description: "Supplier farms that AgriFresh buys produce from."
      - name: products
        description: "Product master (SKU, cost, list price)."
      - name: employees
        description: "Sales team; manager_id self-references employee_id."
      - name: customers
        description: "B2B customers. Contains multiple versions per customer_id (CDC style, ordered by updated_at)."
      - name: fx_rates
        description: "Monthly FX rates to USD."
      - name: purchase_orders
        description: "Produce received from farms into warehouses."
      - name: sales_orders
        description: "Sales order header."
      - name: sales_order_lines
        description: "Sales order line items."
      - name: shipments
        description: "One shipment per shipped sales order."
      - name: payments
        description: "Customer payments against sales orders."
